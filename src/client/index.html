<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OMP Prompt Monitor</title>
<link rel="icon" type="image/png" href="/icon.png" />
<style>
:root {
	color-scheme: dark;
	--page: oklch(0.16 0.02 307);
	--surface: oklch(0.19 0.022 307);
	--surface-2: oklch(0.235 0.026 307);
	--border: oklch(1 0 0 / 9%);
	--border-strong: oklch(1 0 0 / 15%);
	--text: oklch(0.92 0.01 307);
	--muted: oklch(0.71 0.016 307);
	--dim: oklch(0.53 0.018 307);
	--pink: oklch(0.674 0.23 341);
	--cyan: oklch(0.817 0.112 205);
	--green: oklch(0.76 0.14 150);
	--amber: oklch(0.79 0.14 85);
	--red: oklch(0.66 0.19 25);
	--radius: 6px;
}

* { box-sizing: border-box; }
body {
	margin: 0;
	font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
	background: var(--page);
	color: var(--text);
	height: 100vh;
	display: flex;
	flex-direction: column;
}
button, input, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible {
	outline: 2px solid var(--cyan);
	outline-offset: 2px;
}
header {
	padding: 0.8rem 1rem;
	border-bottom: 1px solid var(--border);
	display: flex;
	align-items: center;
	gap: 1rem;
	background: color-mix(in srgb, var(--surface) 88%, transparent);
}
.brand { min-width: 11rem; display: flex; align-items: center; gap: 0.55rem; }
.brand-mark { width: 28px; height: 28px; flex: none; }
.brand-kicker, .section-label {
	font-family: ui-monospace, monospace;
	font-size: 0.65rem;
	font-weight: 700;
	letter-spacing: 0.13em;
	text-transform: uppercase;
	color: var(--pink);
}
header h1 {
	font-family: ui-monospace, monospace;
	font-size: 1rem;
	letter-spacing: -0.04em;
	margin: 0.1rem 0 0;
	font-weight: 700;
}
input[type="search"], select {
	background: var(--surface);
	border: 1px solid var(--border-strong);
	color: var(--text);
	padding: 0.42rem 0.6rem;
	border-radius: var(--radius);
}
input[type="search"] { flex: 1; max-width: 28rem; }
select { min-width: 10rem; }
main {
	flex: 1;
	display: grid;
	grid-template-columns: 18rem 23rem minmax(0, 1fr);
	overflow: hidden;
}
.col {
	min-width: 0;
	overflow-y: auto;
	border-right: 1px solid var(--border);
	padding: 0.75rem;
}
.col:last-child { border-right: none; }
.section-heading {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 0.2rem 0.35rem 0.6rem;
}
.section-count { color: var(--dim); font: 0.7rem ui-monospace, monospace; }
.project-item, .session-item, .prompt-row {
		position: relative;
		display: block;
		width: 100%;
		text-align: left;
		background: transparent;
		border: 1px solid transparent;
		border-radius: var(--radius);
		margin-bottom: 0.3rem;
}
.project-item, .session-item { padding: 0.6rem 0.65rem 0.6rem 0.85rem; cursor: pointer; }
.project-item:hover, .session-item:hover { background: var(--surface); border-color: var(--border); }
.project-item.active, .session-item.active { background: var(--surface-2); border-color: color-mix(in srgb, var(--pink) 60%, var(--border)); }
.session-item::before, .prompt-row::before {
	content: "";
	position: absolute;
	left: 0;
	top: 0.55rem;
	bottom: 0.55rem;
	width: 3px;
	border-radius: 4px;
	background: var(--dim);
}
.session-item.liveness-live::before { background: var(--green); box-shadow: 0 0 10px color-mix(in srgb, var(--green) 80%, transparent); animation: heartbeat 2.2s ease-in-out infinite; }
.session-item.liveness-recent::before { background: var(--amber); }
.session-item.liveness-idle::before { background: var(--dim); }
@keyframes heartbeat { 50% { opacity: 0.42; } }
.project-title, .session-title { display: block; font-weight: 650; font-size: 0.84rem; }
.project-meta, .session-meta, .prompt-meta { display: block; font-size: 0.72rem; color: var(--muted); margin-top: 0.22rem; }
.chip, .status-pill {
	display: inline-flex;
	align-items: center;
	font-size: 0.65rem;
	font-weight: 700;
	line-height: 1.2;
	padding: 0.18rem 0.42rem;
	border-radius: 999px;
	text-transform: uppercase;
	letter-spacing: 0.05em;
}
.chip.live, .status-pill[data-status="complete"] { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.chip.recent, .status-pill[data-status="interrupted"] { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
.chip.idle, .status-pill[data-status="unknown"] { background: color-mix(in srgb, var(--dim) 22%, transparent); color: var(--muted); }
.status-pill[data-status="pending"] { background: color-mix(in srgb, var(--cyan) 18%, transparent); color: var(--cyan); }
.status-pill[data-status="error"], .status-pill[data-status="aborted"] { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
.filter-bar { display: flex; gap: 0.2rem; margin: 0 0 0.7rem; padding: 0.18rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
.filter-button { flex: 1; border: 0; background: transparent; color: var(--muted); border-radius: 4px; padding: 0.3rem 0.2rem; font-size: 0.68rem; cursor: pointer; }
.filter-button:hover { color: var(--text); }
.filter-button.active { background: var(--surface-2); color: var(--pink); }
.detail-heading { border-bottom: 1px solid var(--border); padding: 0.2rem 0.25rem 0.85rem; margin-bottom: 0.1rem; }
.detail-title { font-family: ui-monospace, monospace; font-size: 0.95rem; font-weight: 700; margin-bottom: 0.45rem; }
.detail-meta { display: flex; align-items: center; gap: 0.45rem; color: var(--muted); font-size: 0.72rem; }
.prompt-row { padding: 0.7rem 0.8rem 0.75rem 0.85rem; }
.prompt-row.prompt-user::before { background: var(--pink); }
.prompt-row.prompt-reply { background: color-mix(in srgb, var(--cyan) 3%, transparent); }
.prompt-row.prompt-reply::before { background: var(--cyan); }
.prompt-row:hover { background: var(--surface); border-color: var(--border); }
.prompt-head { display: flex; align-items: center; gap: 0.45rem; }
.speaker { font: 700 0.8rem ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
.speaker.user { color: var(--pink); }
.speaker.agent { color: var(--cyan); }
.kind-badge { font-size: 0.62rem; padding: 0.13rem 0.35rem; border-radius: 4px; background: color-mix(in srgb, var(--pink) 12%, transparent); color: var(--pink); border: 1px solid color-mix(in srgb, var(--pink) 25%, transparent); }
.prompt-row pre { white-space: pre-wrap; word-break: break-word; margin: 0.45rem 0 0; color: var(--text); font: 0.84rem/1.55 ui-monospace, monospace; }
.prompt-reply pre { color: color-mix(in srgb, var(--text) 80%, var(--cyan)); }
.copy-button { margin-left: auto; align-self: center; display: inline-flex; align-items: center; padding: 0.2rem; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--muted); cursor: pointer; opacity: 0.55; transition: opacity 120ms ease, color 120ms ease; }
.copy-button svg { width: 13px; height: 13px; display: block; }
.prompt-row:hover .copy-button, .copy-button:focus-visible { opacity: 1; }
.copy-button:hover { color: var(--text); background: var(--surface-2); border-color: var(--border); }
.copy-button.copied { color: var(--green); opacity: 1; }
#copy-toast { position: fixed; right: 1rem; bottom: 2.4rem; z-index: 5; background: var(--surface-2); border: 1px solid var(--border-strong); color: var(--text); border-radius: var(--radius); padding: 0.35rem 0.6rem; font: 0.68rem ui-monospace, monospace; pointer-events: none; }
#copy-toast:empty { display: none; }
footer { padding: 0.45rem 1rem; border-top: 1px solid var(--border); font: 0.66rem ui-monospace, monospace; color: var(--dim); display: flex; justify-content: space-between; gap: 1rem; }
#footer-update { color: var(--amber); }
#footer-update:empty { display: none; }
.empty { color: var(--muted); padding: 1rem 0.35rem; font-size: 0.82rem; }
@media (max-width: 900px) {
	body { height: auto; min-height: 100vh; }
	header { flex-wrap: wrap; }
	.brand { flex-basis: 100%; }
	main { grid-template-columns: minmax(14rem, 0.8fr) minmax(18rem, 1fr); overflow: visible; }
	#prompts { grid-column: 1 / -1; min-height: 24rem; border-top: 1px solid var(--border); }
}
@media (max-width: 560px) {
	main { display: block; }
	.col { min-height: 14rem; max-height: 34rem; border-right: 0; border-bottom: 1px solid var(--border); }
	#prompts { max-height: none; }
	footer { display: block; line-height: 1.6; }
}
@media (prefers-reduced-motion: reduce) { .session-item.liveness-live::before { animation: none; } }
</style>
</head>
<body>
<header>
	<div class="brand">
		<img class="brand-mark" src="/icon.png" alt="" width="28" height="28" />
		<div class="brand-text">
			<div class="brand-kicker">omp / field notes</div>
			<h1>prompt monitor</h1>
		</div>
	</div>
	<input id="search" type="search" placeholder="Search the journal…" />
	<select id="project-filter"><option value="">All projects</option></select>
</header>
<main>
	<div class="col" id="projects"></div>
	<div class="col" id="sessions"></div>
	<div class="col" id="prompts"></div>
</main>
<footer>
	<span id="footer-root"></span>
	<span id="footer-update"></span>
	<span id="footer-generated"></span>
</footer>
<div id="copy-toast" role="status" aria-live="polite"></div>
<template id="icon-copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2" /><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" /></svg></template>
<template id="icon-copied"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5" /></svg></template>
<script>
"use strict";

const state = { snapshot: null, selectedProjectKey: "", selectedSessionId: null, sessionDetail: null, search: "", livenessFilter: "", promptRole: "", updateStatus: null, updateCheckedAt: 0, copiedKey: null };
const UPDATE_CHECK_INTERVAL_MS = 30 * 60 * 1000;

function relativeTime(ms) {
	if (!Number.isFinite(ms)) return "unknown";
	const diff = Date.now() - ms;
	const mins = Math.floor(diff / 60000);
	if (mins < 1) return "just now";
	if (mins < 60) return mins + "m ago";
	const hours = Math.floor(mins / 60);
	if (hours < 24) return hours + "h ago";
	return Math.floor(hours / 24) + "d ago";
}

function livenessTitle(liveness, pid) {
	if (liveness === "live") return "heartbeat from pid " + pid;
	if (liveness === "recent") return "file changed in the last 15 min; liveness unknown";
	return "no recent activity";
}

function matchesRole(prompt, role) {
	if (!role) return true;
	if (role === "agent") return prompt.kind === "reply";
	return prompt.kind !== "reply";
}

function el(tag, className, text) {
	const node = document.createElement(tag);
	if (className) node.className = className;
	if (text !== undefined) node.textContent = text;
	return node;
}

async function fetchSnapshot() {
	const response = await fetch("/api/snapshot");
	if (!response.ok) throw new Error("snapshot fetch failed: " + response.status);
	return response.json();
}

async function fetchUpdateStatus() {
	const response = await fetch("/api/update");
	if (!response.ok) return null;
	return response.json();
}

async function maybeCheckUpdate() {
	if (state.updateCheckedAt && Date.now() - state.updateCheckedAt < UPDATE_CHECK_INTERVAL_MS) return;
	state.updateCheckedAt = Date.now();
	try { state.updateStatus = await fetchUpdateStatus(); renderFooter(); } catch (err) { console.error(err); }
}

async function fetchSession(id) {
	const response = await fetch("/api/session/" + encodeURIComponent(id));
	if (!response.ok) return null;
	return (await response.json()).session;
}

function renderProjects() {
	const container = document.getElementById("projects");
	container.replaceChildren();
	const select = document.getElementById("project-filter");
	const existingValue = select.value;
	select.replaceChildren(el("option", null, "All projects"));
	select.options[0].value = "";
	if (!state.snapshot) return;
	const heading = el("div", "section-heading");
	heading.append(el("span", "section-label", "Projects"), el("span", "section-count", String(state.snapshot.projects.length)));
	container.appendChild(heading);
	for (const project of state.snapshot.projects) {
		const option = el("option", null, project.repoLabel + " (" + project.sessionIds.length + ")");
		option.value = project.key;
		select.appendChild(option);
		const item = el("button", "project-item" + (state.selectedProjectKey === project.key ? " active" : ""));
		item.type = "button";
		item.appendChild(el("span", "project-title", project.repoLabel));
		const meta = el("span", "project-meta", project.sessionIds.length + " sessions · " + relativeTime(project.lastActivityAt));
		if (project.liveCount > 0) meta.appendChild(el("span", "chip live", project.liveCount + " live"));
		item.appendChild(meta);
		item.addEventListener("click", () => {
			state.selectedProjectKey = state.selectedProjectKey === project.key ? "" : project.key;
			state.selectedSessionId = null;
			state.sessionDetail = null;
			render();
		});
		container.appendChild(item);
	}
	select.value = existingValue && [...select.options].some((option) => option.value === existingValue) ? existingValue : state.selectedProjectKey;
}

function visibleSessions() {
	if (!state.snapshot) return [];
	let sessions = state.snapshot.sessions;
	if (state.selectedProjectKey) sessions = sessions.filter((session) => (session.repoRoot ?? session.cwd) === state.selectedProjectKey);
	if (state.livenessFilter) sessions = sessions.filter((session) => session.liveness === state.livenessFilter);
	return sessions;
}

function renderSessions() {
	const container = document.getElementById("sessions");
	container.replaceChildren();
	const sessions = visibleSessions();
	const heading = el("div", "section-heading");
	heading.append(el("span", "section-label", "Sessions"), el("span", "section-count", String(sessions.length)));
	container.appendChild(heading);
	const filters = el("div", "filter-bar");
	for (const [value, label] of [["", "All"], ["live", "Live"], ["recent", "Recent"], ["idle", "Idle"]]) {
		const button = el("button", "filter-button" + (state.livenessFilter === value ? " active" : ""), label);
		button.type = "button";
		button.setAttribute("aria-pressed", String(state.livenessFilter === value));
		button.addEventListener("click", () => { state.livenessFilter = value; renderSessions(); });
		filters.appendChild(button);
	}
	container.appendChild(filters);
	if (sessions.length === 0) { container.appendChild(el("div", "empty", "No sessions in this view.")); return; }
	for (const session of sessions) {
		const item = el("button", "session-item liveness-" + session.liveness + (state.selectedSessionId === session.id ? " active" : ""));
		item.type = "button";
		const titleRow = el("span", "session-title", session.title);
		const chip = el("span", "chip " + session.liveness, session.liveness);
		chip.title = livenessTitle(session.liveness, session.pid);
		chip.style.marginLeft = "0.4rem";
		titleRow.appendChild(chip);
		item.append(titleRow, el("span", "session-meta", session.promptCount + " prompts · " + relativeTime(session.lastActivityAt) + " · " + session.repoLabel));
		item.addEventListener("click", async () => { state.selectedSessionId = session.id; state.sessionDetail = await fetchSession(session.id); render(); });
		container.appendChild(item);
	}
}

const COPY_FEEDBACK_MS = 1400;
const TOAST_MS = 2200;
let copyTimer = null;
let toastTimer = null;

function promptKey(prompt) { return prompt.entryId || prompt.kind + ":" + prompt.at; }

function copyTitle(prompt) {
	if (prompt.kind === "reply") return "Copy this reply";
	if (prompt.kind !== "skill") return "Copy this prompt";
	return prompt.skillArgs ? "Copy your request (skill instructions excluded)" : "Copy the skill instructions";
}

function copyNote(prompt) {
	if (prompt.kind !== "skill") return "";
	return prompt.skillArgs ? " · your request only" : " · skill instructions";
}

function formatChars(count) { return count < 1000 ? count + " chars" : (count / 1000).toFixed(1) + "k chars"; }

function showToast(message) {
	const node = document.getElementById("copy-toast");
	node.textContent = message;
	if (toastTimer) clearTimeout(toastTimer);
	toastTimer = setTimeout(() => { node.textContent = ""; toastTimer = null; }, TOAST_MS);
}

async function writeClipboard(text) {
	if (navigator.clipboard && navigator.clipboard.writeText) {
		try { await navigator.clipboard.writeText(text); return true; } catch (err) { console.error(err); }
	}
	const area = document.createElement("textarea");
	area.value = text;
	area.setAttribute("readonly", "");
	area.style.position = "fixed";
	area.style.top = "-1000px";
	document.body.appendChild(area);
	area.select();
	let ok = false;
	try { ok = document.execCommand("copy"); } catch (err) { console.error(err); }
	area.remove();
	return ok;
}

async function copyPrompt(prompt) {
	const text = prompt.copyText ?? prompt.text;
	if (!(await writeClipboard(text))) { showToast("Copy failed — select the text and press Ctrl+C"); return; }
	state.copiedKey = promptKey(prompt);
	if (copyTimer) clearTimeout(copyTimer);
	copyTimer = setTimeout(() => { state.copiedKey = null; copyTimer = null; renderPrompts(); }, COPY_FEEDBACK_MS);
	showToast("Copied " + formatChars(text.length) + copyNote(prompt));
	renderPrompts();
}

function renderPrompts() {
	const container = document.getElementById("prompts");
	container.replaceChildren();
	const heading = el("div", "section-heading");
	const count = el("span", "section-count", "0");
	heading.append(el("span", "section-label", "Journal"), count);
	container.appendChild(heading);
	if (!state.sessionDetail) { container.appendChild(el("div", "empty", "Select a session to open its journal.")); return; }
	const session = state.sessionDetail;
	const detail = el("div", "detail-heading");
	detail.appendChild(el("div", "detail-title", session.title));
	const meta = el("div", "detail-meta");
	const status = el("span", "status-pill", session.tailStatus);
	status.dataset.status = session.tailStatus;
	meta.append(el("span", "chip " + session.liveness, session.liveness), status);
	detail.appendChild(meta);
	container.appendChild(detail);
	const roleFilters = el("div", "filter-bar");
	for (const [value, label] of [["", "All"], ["you", "You"], ["agent", "Agent"]]) {
		const button = el("button", "filter-button" + (state.promptRole === value ? " active" : ""), label);
		button.type = "button";
		button.setAttribute("aria-pressed", String(state.promptRole === value));
		button.addEventListener("click", () => { state.promptRole = value; renderPrompts(); });
		roleFilters.appendChild(button);
	}
	container.appendChild(roleFilters);
	const query = state.search.trim().toLowerCase();
	const prompts = session.prompts.filter((prompt) => (!query || prompt.text.toLowerCase().includes(query)) && matchesRole(prompt, state.promptRole));
	count.textContent = String(prompts.length);
	if (prompts.length === 0) { container.appendChild(el("div", "empty", "No journal entries match.")); return; }
	for (const prompt of prompts) {
		const isReply = prompt.kind === "reply";
		const row = el("article", "prompt-row " + (isReply ? "prompt-reply" : "prompt-user"));
		const head = el("div", "prompt-head");
		head.append(el("span", "speaker " + (isReply ? "agent" : "user"), isReply ? "Agent" : "You"));
		if (prompt.kind === "skill") head.appendChild(el("span", "kind-badge", "skill"));
		const key = promptKey(prompt);
		const copied = state.copiedKey === key;
		const copyButton = el("button", "copy-button" + (copied ? " copied" : ""));
		copyButton.type = "button";
		copyButton.appendChild(document.getElementById(copied ? "icon-copied" : "icon-copy").content.cloneNode(true));
		const copyLabel = copied ? "Copied" : copyTitle(prompt);
		copyButton.title = copyLabel;
		copyButton.setAttribute("aria-label", copyLabel);
		copyButton.addEventListener("click", () => { void copyPrompt(prompt); });
		head.appendChild(copyButton);
		row.appendChild(head);
		row.appendChild(el("div", "prompt-meta", new Date(prompt.at).toLocaleString() + " · " + relativeTime(prompt.at) + " · " + formatChars(prompt.text.length)));
		const pre = document.createElement("pre");
		pre.textContent = prompt.text;
		row.appendChild(pre);
		container.appendChild(row);
	}
}

function renderFooter() {
	const update = state.updateStatus;
	document.getElementById("footer-update").textContent =
		update && update.updateAvailable ? "update available: " + update.current + " → " + update.latest + " · run /monitor update" : "";
	if (!state.snapshot) return;
	document.getElementById("footer-root").textContent = state.snapshot.sessionsRoot;
	document.getElementById("footer-generated").textContent = "updated " + new Date(state.snapshot.generatedAt).toLocaleTimeString();
}

function render() { renderProjects(); renderSessions(); renderPrompts(); renderFooter(); }

async function refresh() {
	if (document.hidden) return;
	try { state.snapshot = await fetchSnapshot(); render(); void maybeCheckUpdate(); } catch (err) { console.error(err); }
}

document.getElementById("search").addEventListener("input", (event) => { state.search = event.target.value; renderPrompts(); });
document.getElementById("project-filter").addEventListener("change", (event) => {
	state.selectedProjectKey = event.target.value;
	state.selectedSessionId = null;
	state.sessionDetail = null;
	render();
});

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
